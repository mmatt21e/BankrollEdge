# Builds the web PWA and deploys it to GitHub Pages on every push to the
# default branch. The site is served at https://<owner>.github.io/BankrollEdge/
name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [claude/android-bankroll-tracker-wmlgkd]
    paths: ['web/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and test
        working-directory: web
        run: |
          npm ci
          npm test
      - name: Build with Pages base path
        working-directory: web
        env:
          PAGES_BASE: /BankrollEdge/
        run: npm run build
      - name: SPA fallback for deep links
        run: cp web/dist/index.html web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
