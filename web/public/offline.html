<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BankrollEdge — Offline</title>
    <style>
      body {
        margin: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f1e17;
        color: #f5f1e6;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      .card { padding: 24px; max-width: 420px; }
      h1 { color: #e0b646; font-size: 1.4rem; }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 12px 24px;
        min-height: 44px;
        box-sizing: border-box;
        background: #e0b646;
        color: #0f1e17;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        BankrollEdge normally works fully offline once it has loaded at least
        once. This page appears only if the app shell isn't cached yet.
      </p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
